name: Build Android Control Panel APK

on:
  push:
    branches:
      - android-control-panel-app
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-control-panel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-Composer-Control-Panel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Composer-Control-Panel-APK
          path: android-app/AI-Composer-Control-Panel.apk
          if-no-files-found: error
